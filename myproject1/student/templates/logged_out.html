<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Signed out | College Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1219;
            --surface: #171b26;
            --surface-2: #1e2331;
            --line: #2a3144;
            --text: #e9ecf4;
            --muted: #8b94a9;
            --accent: #7f8cff;
            --accent-2: #5fd0c5;
            --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(900px 500px at 15% -10%, rgba(127, 140, 255, 0.14), transparent 60%),
                radial-gradient(700px 400px at 100% 110%, rgba(95, 208, 197, 0.09), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.5;
        }

        .auth-card {
            --mx: 50%;
            --my: 0%;
            position: relative;
            width: min(100%, 440px);
            padding: 44px 36px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
            animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(300px circle at var(--mx) var(--my), rgba(127, 140, 255, 0.16), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .auth-card:hover::before { opacity: 1; }
        .auth-card > * { position: relative; }

        .success-mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 22px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(95, 208, 197, 0.1);
            border: 1px solid rgba(95, 208, 197, 0.35);
            animation: pop 0.6s 0.25s cubic-bezier(0.2, 1.4, 0.4, 1) both;
        }

        .success-mark svg {
            width: 34px;
            height: 34px;
            fill: none;
            stroke: var(--accent-2);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 30;
            stroke-dashoffset: 30;
            animation: draw 0.5s 0.6s ease forwards;
        }

        .eyebrow {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-2);
            margin-bottom: 6px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .intro {
            margin: 10px auto 28px;
            max-width: 32ch;
            color: var(--muted);
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            font: inherit;
            font-weight: 800;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .button-primary {
            color: #0f1219;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        .button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(127, 140, 255, 0.35);
        }
        .button-primary:active { transform: translateY(0) scale(0.99); }
        .button-primary:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: none; }
        }

        @keyframes pop {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        @media (max-width: 480px) {
            .auth-card { padding: 32px 24px; }
            .button { display: block; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before { animation: none !important; transition: none !important; }
            .success-mark svg { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <section class="auth-card signed-out-card" id="card" aria-labelledby="page-title">
            <div class="success-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </div>
            <p class="eyebrow">College Portal</p>
            <h1 id="page-title">You’re signed out</h1>
            <p class="intro">Your session has ended. Thanks for stopping by.</p>
            <a class="button button-primary button-link" href="{% url 'login' %}">Sign in again</a>
        </section>
    </main>

    <script>
        (function () {
            var card = document.getElementById("card");
            card.addEventListener("pointermove", function (e) {
                var r = card.getBoundingClientRect();
                card.style.setProperty("--mx", (e.clientX - r.left) + "px");
                card.style.setProperty("--my", (e.clientY - r.top) + "px");
            });
        })();
    </script>
</body>
</html>
