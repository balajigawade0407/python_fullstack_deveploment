<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Signed out | College Portal</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'student/auth.css' %}">
</head>
<body>
    <main class="page-shell">
        <section class="auth-card signed-out-card" aria-labelledby="page-title">
            <div class="success-mark" aria-hidden="true">✓</div>
            <p class="eyebrow">College Portal</p>
            <h1 id="page-title">You’re signed out</h1>
            <p class="intro">Your session has ended. Thanks for stopping by.</p>
            <a class="button button-primary button-link" href="{% url 'login' %}">Sign in again</a>
        </section>
    </main>
</body>
</html>
