<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1219;
            --surface: #171b26;
            --surface-2: #1e2331;
            --line: #2a3144;
            --text: #e9ecf4;
            --muted: #8b94a9;
            --accent: #7f8cff;
            --accent-2: #5fd0c5;
            --danger: #ff7b8a;
            --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(900px 500px at 15% -10%, rgba(127, 140, 255, 0.14), transparent 60%),
                radial-gradient(700px 400px at 100% 110%, rgba(95, 208, 197, 0.09), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.5;
        }

        .login {
            --mx: 50%;
            --my: 0%;
            position: relative;
            width: min(100%, 420px);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 36px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
            animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .login::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(300px circle at var(--mx) var(--my), rgba(127, 140, 255, 0.16), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .login:hover::before { opacity: 1; }

        .login > * { position: relative; }

        .logo {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }
        .logo svg { width: 26px; height: 26px; stroke: #0f1219; }

        h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .sub {
            margin: 6px 0 26px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .alert {
            margin-bottom: 18px;
            padding: 10px 14px;
            font-size: 0.9rem;
            color: var(--danger);
            background: rgba(255, 123, 138, 0.08);
            border: 1px solid rgba(255, 123, 138, 0.35);
            border-radius: 12px;
        }

        .field { margin-bottom: 16px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
        }

        .control { position: relative; }

        input {
            width: 100%;
            padding: 14px 16px;
            font: inherit;
            color: var(--text);
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder { color: #5d667b; }

        input:hover { border-color: #3a4360; }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(127, 140, 255, 0.18);
        }

        .control input[type="password"],
        .control input.has-toggle { padding-right: 64px; }

        .toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            padding: 4px 10px;
            font: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 8px;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease;
        }
        .toggle:hover { color: var(--accent); border-color: var(--accent); }
        .toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .submit {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            font: inherit;
            font-weight: 800;
            font-size: 1rem;
            color: #0f1219;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        .submit:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(127, 140, 255, 0.35); }
        .submit:active { transform: translateY(0) scale(0.99); }
        .submit:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        .submit[disabled] { opacity: 0.7; cursor: progress; transform: none; box-shadow: none; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: none; }
        }

        @media (max-width: 480px) {
            .login { padding: 26px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="login" id="card">
        <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
        </div>

        <h1>Welcome back</h1>
        <p class="sub">Log in to continue to your account.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" id="login-form">
            {% csrf_token %}

            <div class="field">
                <label for="username">Username</label>
                <div class="control">
                    <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required autofocus>
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="control">
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false">Show</button>
                </div>
            </div>

            <button type="submit" class="submit" id="submit">Login</button>
        </form>
    </main>

    <script>
        (function () {
            var card = document.getElementById("card");
            var pw = document.getElementById("password");
            var toggle = document.getElementById("toggle");
            var form = document.getElementById("login-form");
            var submit = document.getElementById("submit");

            // Cursor spotlight
            card.addEventListener("pointermove", function (e) {
                var r = card.getBoundingClientRect();
                card.style.setProperty("--mx", (e.clientX - r.left) + "px");
                card.style.setProperty("--my", (e.clientY - r.top) + "px");
            });

            // Show / hide password
            toggle.addEventListener("click", function () {
                var show = pw.type === "password";
                pw.type = show ? "text" : "password";
                toggle.textContent = show ? "Hide" : "Show";
                toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
                toggle.setAttribute("aria-pressed", show ? "true" : "false");
            });

            // Loading state on submit
            form.addEventListener("submit", function () {
                submit.disabled = true;
                submit.textContent = "Logging in...";
            });
        })();
    </script>
</body>
</html>
