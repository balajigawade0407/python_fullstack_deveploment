<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1219;
            --surface: #171b26;
            --surface-2: #1e2331;
            --line: #2a3144;
            --text: #e9ecf4;
            --muted: #8b94a9;
            --accent: #7f8cff;
            --accent-2: #5fd0c5;
            --danger: #ff7b8a;
            --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background:
                radial-gradient(900px 500px at 15% -10%, rgba(127, 140, 255, 0.14), transparent 60%),
                radial-gradient(700px 400px at 100% 110%, rgba(95, 208, 197, 0.09), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.5;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 28px;
            background: rgba(23, 27, 38, 0.85);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(10px);
        }

        .user {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .avatar {
            flex: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 800;
            color: #0f1219;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        .user-name {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .logout {
            padding: 9px 18px;
            font: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 12px;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }
        .logout:hover { color: var(--danger); border-color: var(--danger); transform: translateY(-1px); }
        .logout:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 56px 28px;
        }

        .welcome {
            --mx: 50%;
            --my: 0%;
            position: relative;
            padding: 40px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
            animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .welcome::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(360px circle at var(--mx) var(--my), rgba(127, 140, 255, 0.16), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .welcome:hover::before { opacity: 1; }
        .welcome > * { position: relative; }

        .greeting {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-2);
            margin-bottom: 6px;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
            word-break: break-word;
        }

        .sub {
            margin-top: 10px;
            color: var(--muted);
        }

        .clock {
            margin-top: 22px;
            display: inline-block;
            padding: 6px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 999px;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: none; }
        }

        @media (max-width: 480px) {
            .topbar { padding: 14px 18px; }
            main { padding: 32px 18px; }
            .welcome { padding: 28px 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="user">
            <div class="avatar" id="avatar" aria-hidden="true">?</div>
            <span class="user-name" id="user-name">{{ request.user.username }}</span>
        </div>

        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="logout">Logout</button>
        </form>
    </header>

    <main>
        <section class="welcome" id="card">
            <p class="greeting" id="greeting">Welcome</p>
            <h1>Welcome, {{ request.user.username }}!</h1>
            <p class="sub">You are logged in. Everything for your account is here.</p>
            <span class="clock" id="clock"></span>
        </section>
    </main>

    <script>
        (function () {
            var card = document.getElementById("card");

            // Avatar initial from username
            var name = document.getElementById("user-name").textContent.trim();
            document.getElementById("avatar").textContent = name ? name[0].toUpperCase() : "?";

            // Time-based greeting
            var hour = new Date().getHours();
            var text = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
            document.getElementById("greeting").textContent = text;

            // Live date and time
            var clock = document.getElementById("clock");
            function updateClock() {
                var now = new Date();
                clock.textContent = now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })
                    + " | " + now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
            }
            updateClock();
            setInterval(updateClock, 30000);

            // Cursor spotlight
            card.addEventListener("pointermove", function (e) {
                var r = card.getBoundingClientRect();
                card.style.setProperty("--mx", (e.clientX - r.left) + "px");
                card.style.setProperty("--my", (e.clientY - r.top) + "px");
            });
        })();
    </script>
</body>
</html>
