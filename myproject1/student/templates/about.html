<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | KLE Society's BCA PC Jabin College</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1219;
            --surface: #171b26;
            --surface-2: #1e2331;
            --line: #2a3144;
            --text: #e9ecf4;
            --muted: #8b94a9;
            --accent: #7f8cff;
            --accent-2: #5fd0c5;
            --font: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(900px 500px at 15% -10%, rgba(127, 140, 255, 0.14), transparent 60%),
                radial-gradient(700px 400px at 100% 110%, rgba(95, 208, 197, 0.09), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.6;
        }

        .about {
            --mx: 50%;
            --my: 0%;
            position: relative;
            width: min(100%, 640px);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 44px 40px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
            animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .about::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(340px circle at var(--mx) var(--my), rgba(127, 140, 255, 0.16), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .about:hover::before { opacity: 1; }

        .about > * { position: relative; }

        .mark {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            margin-bottom: 24px;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            color: #0f1219;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
        }

        .kicker {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-2);
            margin-bottom: 6px;
        }

        h1 {
            font-size: clamp(1.6rem, 4.5vw, 2.1rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 18px;
        }

        .desc {
            max-width: 60ch;
            color: var(--muted);
            font-size: 1rem;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 28px;
        }

        .tag {
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 999px;
            transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }
        .tag:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: none; }
        }

        @media (max-width: 480px) {
            .about { padding: 28px 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="about" id="card">
        <div class="mark" aria-hidden="true">KLE</div>

        <p class="kicker">About</p>
        <h1>KLE Society's BCA PC Jabin College</h1>

        <!-- Replace this paragraph with your own description -->
        <p class="desc">
            Add a short description of the college or of this application here.
        </p>

        <div class="tags">
            <span class="tag">BCA</span>
            <span class="tag">KLE Society</span>
        </div>
    </main>

    <script>
        (function () {
            var card = document.getElementById("card");
            card.addEventListener("pointermove", function (e) {
                var r = card.getBoundingClientRect();
                card.style.setProperty("--mx", (e.clientX - r.left) + "px");
                card.style.setProperty("--my", (e.clientY - r.top) + "px");
            });
        })();
    </script>
</body>
</html>
